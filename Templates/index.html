<!DOCTYPE html>
<html>
<head>
    <title>Spam Email Detection</title>
    <style>
        body{
            background:#f2f2f2;
            font-family:Arial;
        }

        .container{
            width:600px;
            margin:80px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
            text-align:center;
        }

        textarea{
            width:100%;
            height:180px;
            padding:10px;
            font-size:16px;
        }

        button{
            margin-top:20px;
            width:100%;
            padding:12px;
            background:#007BFF;
            color:white;
            border:none;
            border-radius:5px;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Spam Email Detection</h2>

<form action="/predict" method="POST">

<textarea
name="message"
placeholder="Enter email text here..."
required></textarea>

<button type="submit">
Predict
</button>

</form>

</div>

</body>
</html>
